name: Release

# Tag a version to publish installers:
#   git tag v1.0.0 && git push origin v1.0.0
# Everything is built on GitHub's runners — no local toolchain needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

env:
  VIBEASR_REF: main
  # Windows consoles are cp1252; keep Python's stdio UTF-8 so log text never kills a step
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # macOS arm64 is the reference build; the other targets are best-effort until
    # their C++ build is confirmed on CI.
    continue-on-error: ${{ matrix.soft }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            tag: macos-arm64
            soft: false
          - name: macOS x64
            os: macos-13
            tag: macos-x64
            soft: true
          - name: Linux x64
            os: ubuntu-22.04
            tag: linux-x64
            soft: true
          - name: Windows x64
            os: windows-2022
            tag: windows-x64
            soft: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "building $V"

      - name: Enable long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Build the native engines
        id: engines
        shell: bash
        run: |
          set -e
          git clone --depth 1 --branch "$VIBEASR_REF" https://github.com/microsoft/VibeASR.cpp "$RUNNER_TEMP/VibeASR.cpp"
          cd "$RUNNER_TEMP/VibeASR.cpp"
          # llama.cpp and gguf-py live in submodules; a shallow clone without them
          # leaves 3rdparty/llama.cpp empty and cmake dies on add_subdirectory
          git submodule update --init --recursive --depth 1
          python -m pip install -q gguf || true
          # their setup_env.py runs its own bare cmake configure, which collides
          # with the generator flags set below (Windows: "generator platform: x64")
          # VibeASR.cpp refuses MSVC ("Clang or GCC is required"). clang-cl cannot
          # compile llama.cpp's common.cpp (no <chrono> transitively), so Windows
          # builds with MinGW GCC through MinGW Makefiles.
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install mingw -y --no-progress
            export PATH="/c/ProgramData/mingw64/mingw64/bin:/c/tools/mingw64/bin:$PATH"
            GEN=(-G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++)
            EXTRA=()
          else
            GEN=()
            EXTRA=(-DGGML_OPENMP=OFF)
          fi
          cmake -S . -B build "${GEN[@]}" -DCMAKE_BUILD_TYPE=Release "${EXTRA[@]}"
          cmake --build build --config Release --target asr_stream_server -j 4
          cmake -S . -B build-llm "${GEN[@]}" -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON "${EXTRA[@]}"
          cmake --build build-llm --config Release --target llama-server -j 4

      - name: Collect portable binaries
        shell: bash
        run: python packaging/prepare_bin.py --src "$RUNNER_TEMP/VibeASR.cpp" --out bin

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Icons
        run: python packaging/make_icons.py

      - name: Bundle with PyInstaller
        run: pyinstaller --clean --noconfirm packaging/moscribe.spec

      - name: Package — macOS
        if: runner.os == 'macOS'
        run: |
          ./packaging/macos/make_dmg.sh "${{ steps.ver.outputs.value }}"
          ditto -c -k --sequesterRsrc --keepParent bin "dist/moscribe-${{ matrix.tag }}-bin.zip"

      - name: Package — Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/MoScribe/share/applications dist/MoScribe/share/icons
          cp moscribe/static/brand/app-512.png dist/MoScribe/share/icons/moscribe.png
          cat > dist/MoScribe/share/applications/moscribe.desktop <<'DESK'
          [Desktop Entry]
          Type=Application
          Name=MoScribe
          Comment=Local speech to text
          Exec=MoScribe
          Icon=moscribe
          Terminal=false
          Categories=AudioVideo;Audio;Utility;
          DESK
          tar -C dist -czf "dist/MoScribe-${{ matrix.tag }}.tar.gz" MoScribe
          (cd bin && zip -r "../dist/moscribe-${{ matrix.tag }}-bin.zip" .)
          chmod +x dist/MoScribe/MoScribe

      - name: Package — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/MoScribe/* -DestinationPath "dist/MoScribe-${{ matrix.tag }}.zip"
          Compress-Archive -Path bin/* -DestinationPath "dist/moscribe-${{ matrix.tag }}-bin.zip"
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\moscribe.iss

      - name: Smoke test the bundle (macOS/Linux)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          ./dist/MoScribe/MoScribe --check || true
          ./dist/MoScribe/MoScribe --port 8899 --no-browser &
          sleep 12
          curl -fsS http://127.0.0.1:8899/api/health | head -c 200
          kill %1 || true

      - name: Checksums
        shell: bash
        run: |
          cd dist
          # macOS has no sha256sum, only shasum -a 256
          hash_one() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          for f in *.dmg *.tar.gz *setup.exe *.zip; do
            [ -f "$f" ] && hash_one "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt || true

      - name: Publish this platform
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MoScribe-*
            dist/moscribe-*-bin.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: false

      - uses: actions/upload-artifact@v4
        with:
          name: moscribe-${{ matrix.tag }}
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: warn

  # Assets are published per platform inside `build`, so one failing target never
  # hides the packages that did build. Nothing to aggregate.
